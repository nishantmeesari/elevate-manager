services:
  - type: web
    name: elevate-manager-api
    runtime: python
    rootDir: apps/api
    buildCommand: python -m pip install --upgrade pip && python -m pip install -e .
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_SSLMODE
        value: require
      - key: ALLOW_LOCAL_TEST_PAYMENTS
        value: "false"
      - key: INITIAL_ADMIN_BOOTSTRAP_TOKEN
        sync: false
